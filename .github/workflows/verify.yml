name: Verify UniFi AP Bridge

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        # Pin actions/checkout v6.0.3 (Node 24) to its verified upstream commit.
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up Go
        # Pin actions/setup-go v6.5.0 (Node 24) to its verified upstream commit.
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: '1.22'
          check-latest: true
          # This repository has no external Go modules; avoid searching for go.sum.
          cache: false

      - name: Verify daemon and cluster behavior
        run: |
          go vet ./...
          go test -race ./...
          python3 scripts/test_sync_nodes.py
          python3 scripts/test_watchdog.py
          python3 scripts/test_update_backend.py
          python3 scripts/test_update_apply.py
          python3 scripts/test_startup.py
          python3 scripts/test_install.py
          python3 scripts/test_secret_guard.py
          python3 scripts/test_wlan_mapping.py
          python3 scripts/test_wlan_mapping_publish.py
          python3 scripts/test_mac_wlan_mapping.py
          python3 scripts/test_radio_history.py
          python3 scripts/test_wifi_health_probe.py
          python3 scripts/check_secrets.py
          node scripts/test_update_ui.js
          for script in scripts/*.sh; do sh -n "$script"; done
          # Incremental ShellCheck starts with fresh-install and startup paths.
          # Other firmware scripts retain syntax checks while applet coverage is documented.
          shellcheck -s sh --severity=warning scripts/install.sh scripts/start.sh
