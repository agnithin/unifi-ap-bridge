name: Release & Dev Build UniFi AP Bridge

on:
  push:
    tags:
      - 'v*'
    branches:
      - dev

permissions:
  contents: write

jobs:
  release:
    name: Build & Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          check-latest: true

      - name: Verify daemon and cluster behavior
        run: |
          go test ./...
          python3 scripts/test_sync_nodes.py
          python3 scripts/test_update_backend.py
          python3 scripts/test_update_apply.py
          python3 scripts/test_startup.py
          python3 scripts/test_install.py
          python3 scripts/test_secret_guard.py
          python3 scripts/check_secrets.py
          node scripts/test_update_ui.js
          for script in scripts/*.sh; do sh -n "$script"; done

      - name: Build Binaries
        run: |
          mkdir -p dist

          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VER=$(cat version.txt 2>/dev/null | tr -d ' \t\r\n')
            TAG_NAME="${{ github.ref_name }}"
            RELEASE_NAME="${{ github.ref_name }}"
            IS_PRERELEASE="false"
            [[ "v$VER" == "$TAG_NAME" ]] || { echo "Stable tag and version.txt disagree" >&2; exit 1; }
          else
            VER=$(cat version.txt 2>/dev/null | tr -d ' \t\r\n')
            [ -z "$VER" ] && VER="dev"
            TAG_NAME="dev-${GITHUB_SHA}"
            RELEASE_NAME="Development Build (${VER})"
            IS_PRERELEASE="true"
          fi

          echo "VER=$VER" >> $GITHUB_ENV
          echo "TAG_NAME=$TAG_NAME" >> $GITHUB_ENV
          echo "RELEASE_NAME=$RELEASE_NAME" >> $GITHUB_ENV
          echo "IS_PRERELEASE=$IS_PRERELEASE" >> $GITHUB_ENV

          echo "Building ARMv7 binary ($VER)..."
          CGO_ENABLED=0 GOOS=linux GOARCH=arm GOARM=7 go build -trimpath -ldflags="-s -w -X main.version=$VER -X main.commit=${{ github.sha }} -X main.buildDate=$(date -u +%Y-%m-%d)" -o dist/unifi-bridge-armv7 ./cmd/unifi-bridge
          tar -czf dist/unifi-bridge-armv7.tar.gz -C dist unifi-bridge-armv7
          echo "Building ARM64 binary ($VER)..."
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -ldflags="-s -w -X main.version=$VER -X main.commit=${{ github.sha }} -X main.buildDate=$(date -u +%Y-%m-%d)" -o dist/unifi-bridge-arm64 ./cmd/unifi-bridge
          tar -czf dist/unifi-bridge-arm64.tar.gz -C dist unifi-bridge-arm64
          bundle() {
            arch="$1"
            binary="$2"
            staging="$(mktemp -d)"
            cp "dist/$binary" "$staging/$binary"
            for file in install.sh start.sh apply_config.sh sync_nodes.sh unifi-bridge.sh update.sh watchdog.sh; do
              cp "scripts/$file" "$staging/$file"
            done
            cp webui/unifi-bridge.asp "$staging/unifi-bridge.asp"
            cp version.txt "$staging/version.txt"
            {
              printf '{\n  "version": "%s",\n  "commit": "%s",\n  "architecture": "%s",\n' "$VER" "${GITHUB_SHA}" "$arch"
              first=1
              for file in "$binary" install.sh start.sh apply_config.sh sync_nodes.sh unifi-bridge.sh update.sh watchdog.sh unifi-bridge.asp version.txt; do
                digest=$(sha256sum "$staging/$file" | awk '{print $1}')
                if [[ "$first" == 0 ]]; then printf ',\n'; fi
                printf '  "sha256_%s": "%s"' "$file" "$digest"
                first=0
              done
              printf '\n}\n'
            } > "$staging/bundle.json"
            name="unifi-bridge-addon-${GITHUB_SHA}-${arch}.tar.gz"
            tar -czf "dist/$name" -C "$staging" "$binary" install.sh start.sh apply_config.sh sync_nodes.sh unifi-bridge.sh update.sh watchdog.sh unifi-bridge.asp version.txt bundle.json
            (cd dist && sha256sum "$name" > "$name.sha256")
            rm -rf "$staging"
          }

          bundle armv7 unifi-bridge-armv7
          bundle arm64 unifi-bridge-arm64
          (cd dist && sha256sum unifi-bridge-armv7 unifi-bridge-arm64 unifi-bridge-armv7.tar.gz unifi-bridge-arm64.tar.gz unifi-bridge-addon-*.tar.gz > sha256sums.txt)
          cat dist/sha256sums.txt

      - name: Publish Release or Dev Pre-Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          target_commitish: ${{ github.sha }}
          name: ${{ env.RELEASE_NAME }}
          prerelease: ${{ env.IS_PRERELEASE == 'true' }}
          files: |
            dist/unifi-bridge-armv7
            dist/unifi-bridge-arm64
            dist/unifi-bridge-armv7.tar.gz
            dist/unifi-bridge-arm64.tar.gz
            dist/sha256sums.txt
            dist/unifi-bridge-addon-*.tar.gz
            dist/unifi-bridge-addon-*.tar.gz.sha256
          generate_release_notes: true
